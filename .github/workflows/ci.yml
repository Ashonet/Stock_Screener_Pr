name: ci

# Runs on every push and pull request. Deliberately does NOT call Yahoo: the
# committed landing zone is enough to build and test the entire warehouse, so CI
# is fast, deterministic, and cannot be broken by an upstream outage or a rate
# limit.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node --test test/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dbt
        run: pip install -r pipeline/requirements.txt

      # Builds every model and runs all data tests against the committed raw
      # layer. A transformation bug fails the PR rather than the nightly run.
      - name: Build and test the warehouse
        working-directory: warehouse
        run: dbt build --profiles-dir .

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: warehouse/target/
          retention-days: 7
