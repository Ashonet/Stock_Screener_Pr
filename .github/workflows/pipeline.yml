name: pipeline

# Nightly after the US close, plus a manual trigger.
#
# The whole point of running this on a schedule is that the app no longer calls
# Yahoo at request time. Serving reads the warehouse, so the dashboard is not
# exposed to upstream rate limits or outages, only this job is, and it retries.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Ignore watermarks and re-download all history'
        type: boolean
        default: false
      tier:
        description: 'Which tier to extract'
        type: choice
        options: [deep, wide, all]
        default: deep

concurrency:
  # Never let two runs write the raw layer at once.
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dbt
        run: pip install -r pipeline/requirements.txt

      # Index membership drifts. Refreshing the constituent list weekly keeps
      # additions and removals from silently accumulating, and every symbol is
      # re-validated against the data source before it enters the universe.
      #
      # The day test lives in the shell because Actions has no day-of-week
      # expression, and it is continue-on-error because a constituent-source
      # outage should not take the price load down with it.
      - name: Refresh the universe (Mondays)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node pipeline/build-universe.js --indexes all --deep sp500 --validate deep
          else
            echo "Not Monday - keeping the existing universe."
          fi

      # Deep tier only on a schedule.
      #
      # The universe is about 5,500 names across the S&P 500, the Nasdaq listing
      # and the Russell 2000. Extracting all of them takes hours against an
      # upstream that rate-limits by IP, which does not fit a nightly window and
      # would not be worth it if it did: the tail moves the same way whether it
      # is refreshed daily or weekly, and only the deep tier carries the
      # statements the screener actually reads.
      #
      # The wide tier is a separate scheduled run, and either can be forced from
      # the dispatch input.
      - name: Extract
        run: |
          TIER="${{ inputs.tier }}"
          TIER="${TIER:-deep}"
          ARGS=""
          [ "$TIER" != "all" ] && ARGS="--tier $TIER"
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            node pipeline/extract.js --full $ARGS
          else
            node pipeline/extract.js $ARGS
          fi

      - name: Build and test the warehouse
        working-directory: warehouse
        run: dbt build --profiles-dir .

      # Uploaded whether or not the build passed, so a failed run is debuggable
      # from the artifact rather than only from the log.
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dbt-target
          path: warehouse/target/
          retention-days: 14

      - name: Commit the new raw slice
        run: |
          git config user.name  'pipeline'
          git config user.email 'pipeline@users.noreply.github.com'
          git add warehouse/raw pipeline/state.json pipeline/universe.json
          if git diff --staged --quiet; then
            echo 'Nothing new to commit.'
          else
            git commit -m "data: extract $(date -u +%Y-%m-%d)"
            git push
          fi
