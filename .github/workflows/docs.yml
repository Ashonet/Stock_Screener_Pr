name: docs

# Publishes the dbt documentation site, model descriptions, column-level
# lineage and test coverage, to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dbt
        run: pip install -r pipeline/requirements.txt

      # docs generate needs a built warehouse to attach row counts and to
      # resolve every ref, so build first from the committed raw layer.
      - name: Build the warehouse
        working-directory: warehouse
        run: dbt build --profiles-dir .

      - name: Generate docs
        working-directory: warehouse
        run: dbt docs generate --profiles-dir . --static

      # --static emits a single self-contained index.html, which is exactly what
      # Pages wants and avoids shipping the whole target/ directory.
      - name: Collect the site
        run: |
          mkdir -p _site
          cp warehouse/target/static_index.html _site/index.html || cp warehouse/target/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
